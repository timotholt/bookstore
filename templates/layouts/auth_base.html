<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Authentication - {{ self.store_name() }}{% endblock %}</title>
    <meta name="description" content="Sign in or create an account for {{ self.store_name() }}.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=optional">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=optional" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/assets/htmx.min.js" defer></script>
  </head>
  <body class="{% block body_class %}auth-body{% endblock %}">
    {% block header %}
      {% include "components/header.html" %}
    {% endblock %}

    {% block content %}{% endblock %}

    {% include "components/cart.html" %}

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
